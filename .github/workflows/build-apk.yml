name: Build RUYO SHOP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract RUYO SHOP source
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -name 'RUYO_SHOP_Hisobot_Source*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "RUYO SHOP source ZIP not found"
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Fix PrintManager import
        run: |
          MAIN_ACTIVITY=$(find extracted -name 'MainActivity.java' -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          echo "Fixing: $MAIN_ACTIVITY"
          sed -i 's/import android\.app\.PrintManager;/import android.print.PrintManager;/' "$MAIN_ACTIVITY"

          grep "PrintManager" "$MAIN_ACTIVITY" || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/RUYO_SHOP_Hisobot
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Check APK
        run: |
          APK_FILE="extracted/RUYO_SHOP_Hisobot/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RUYO-SHOP-APK
          path: extracted/RUYO_SHOP_Hisobot/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build RUYO SHOP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract RUYO SHOP source
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -name 'RUYO_SHOP_Hisobot_Source*.zip' | head -n 1)
          echo "Using: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/RUYO_SHOP_Hisobot
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RUYO-SHOP-APK
          path: extracted/RUYO_SHOP_Hisobot/android/app/build/outputs/apk/debug/app-debug.apk
